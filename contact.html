<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Checklist 3: the viewport meta tag -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Dae Fisher</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <nav class="container">
      <button id="theme-toggle" type="button">Dark mode</button>
      <a href="index.html">Home</a>
      <a href="project.html">Projects</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="container">
    <h1>Contact me</h1>
    <p>Questions about my projects? Send me a message with this form.</p>

   
    <section class="contact-form">
       <form id="contact-form">
  <div class="field">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" required>
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>
  </div>
  <div class="field">
    <label for="message">Message (at least 20 characters)</label>
    <textarea id="message" name="message" rows="5" required></textarea>
    <p id="message-error" class="error" role="alert"></p>
  </div>
  <button type="submit">Send</button>
  <p id="thanks" class="thanks" role="status"></p>
</form>
<script src="contact.js"></script>
    </section>
  </main>

  <footer class="container">
    <p>&copy; 2026 Dae Fisher</p>
  </footer>
  <script src="theme.js"></script>
</body>
</html>
